ur own dream signs</h2>\n  <p>Xenoria’s lucid dreaming section is designed to help you do more than practise general techniques. As your own dream collection grows, you can increasingly recognize the people, places, events and dream signs that are characteristic of you.</p>\n  <p>You can then connect these patterns with reality checks and intention-setting before sleep.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">📊</span>Statistics that show change over time</h2>\n  <p>The goal of the statistics is not simply to count things. Xenoria makes recurring patterns, the results of your practice and long-term changes visible.</p>\n  <p>So you can see not only what happened yesterday, but also where you started, where you are now, and what may have helped you get there.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">📖</span>A dream journal that feels like a real dream book</h2>\n  <p>The journal itself is part of the experience. It is not just a simple list of notes, but a magical, book-like dream journal with pages you can turn as if you were holding your own personal dream book.</p>\n  <p>The visual design and selectable frames strengthen the feeling that you are not merely storing entries, but creating a personal dream book that continues to grow over time.</p>\n</div>\n\n<div class=\"notice\">\n  <h3>✨ Your experience stays yours</h3>\n  <p>Xenoria does not try to decide for you what a dream, encounter or unusual state of consciousness meant.</p>\n  <p>It gives you tools to preserve, organize, compare and follow your own experiences over a longer period of time.</p>\n</div>\n", "footerText": "Android App Development", "comingSoon": "Coming Soon"}, "hu": {"navApps": "Alkalmazások", "navAbout": "Rólunk", "navContact": "Kapcsolat", "backApps": "← Vissza az alkalmazásokhoz", "shortDescription": "Az álomnaplók legújabb generációja.", "contactButton": "Kapcsolat aumzeichen,</li>\n    <li>detaillierte Statistiken und eine persönliche Traumkarte,</li>\n    <li>Techniken für luzides Träumen und Training mit Traumzeichen,</li>\n    <li>Realitätschecks: Hände, Text, Uhr, Atmung und persönliche Traumzeichen,</li>\n    <li>bei luziden Träumen: Induktions- und Stabilisierungstechniken, Momente des Erkennens und Ziele,</li>\n    <li>bei Astral- und Seelenreisen: Vorbereitung, Austrittstechniken, Vibrationszustand, teilweise oder vollständige Trennung, Begegnungen, Fragen und Erkenntnisse,</li>\n    <li>bei Meditation: Methoden, körperliche und innere Wahrnehmungen, Energiephänomene, Bewusstseinszustände und Zeitempfinden,</li>\n    <li>Meditations-Timer mit Vorbereitungszeit, Zwischensignalen sowie Start- und Endton,</li>\n    <li>Xenoria-Meditationsmusik und eigene Musik,</li>\n    <li>spezieller Traumwecker für ruhige Traumerinnerung nach dem Aufwachen,</li>\n    <li>Wissensinhalte zu Traumforschung, luzidem Träumen, Meditation und Bewusstseinsforschung.</li>\n  </ul>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">⏰</span>Spezieller Wecker für die Traumerinnerung</h2>\n  <p>Der spezielle Traumwecker funktioniert nicht wie ein herkömmlicher Wecker. Das eingestellte kurze Signal ertönt nur so oft, wie du es festgelegt hast, und verstummt anschließend automatisch.</p>\n  <p>Es gibt keine Schlummerfunktion und du musst nicht sofort zum Smartphone greifen. So kannst du nach dem Aufwachen in Ruhe versuchen, dich an die letzte Traumszene zu erinnern.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">🌌</span>Luzides Träumen mit deinen persönlichen Traumzeichen</h2>\n  <p>Der Bereich für luzides Träumen hilft dir dabei, nicht nur allgemeine Techniken zu üben. Je mehr eigene Träume du sammelst, desto besser kannst du Personen, Orte, Ereignisse und Traumzeichen erkennen, die für dich typisch sind.</p>\n  <p>Diese Muster kannst du anschließend mit Realitätschecks und einer bewussten Absicht vor dem Einschlafen verbinden.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">📊</span>Statistiken, die Veränderungen langfristig sichtbar machen</h2>\n  <p>Das Ziel der Statistiken ist nicht bloßes Zählen. Xenoria macht wiederkehrende Muster, Fortschritte in deiner Praxis und langfristige Veränderungen sichtbar.</p>\n  <p>So siehst du nicht nur, was gestern passiert ist, sondern auch, wo du begonnen hast, wo du heute stehst und was dir auf diesem Weg geholfen hat.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">📖</span>Ein Traumtagebuch, das sich wie ein echtes Traumbuch anfühlt</h2>\n  <p>Das Traumtagebuch selbst ist Teil des Erlebnisses. Es ist keine einfache Notizliste, sondern ein magisches, buchähnliches Traumtagebuch, dessen Seiten sich umblättern lassen, als würdest du dein eigenes persönliches Traumbuch in den Händen halten.</p>\n  <p>Das Design und die wählbaren Rahmen verstärken das Gefühl, dass du nicht nur Einträge speicherst, sondern dein eigenes, stetig wachsendes Traumbuch erschaffst.</p>\n</div>\n\n<div class=\"notice\">\n  <h3>✨ Deine Erfahrung bleibt deine</h3>\n  <p>Xenoria möchte nicht für dich entscheiden, was ein Traum, eine Begegnung oder ein besonderer Bewusstseinszustand bedeutet hat.</p>\n  <p>Die App gibt dir Werkzeuge, um deine eigenen Erfahrungen zu bewahren, zu ordnen, zu vergleichen und über längere Zeit zu verfolgen.</p>\n</div>\n", "footerText": "Android-App-Entwicklung", "comingSoon": "Demnächst"}, "fr": {"navApps": "Applications", "navAbout": "À propos", "navContact": "Contact", "backApps": "← Retour aux applications", "shortDescription": "La nouvelle génération de journaux de rêves.", "contactButton": "Contact", "fullDescription": "\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">🌙</span>Un système personnel pour mieux comprendre votre propre univers onirique</h2>\n  <p>Journal de rêves, méditation, analyse des rêves assistée par IA et rêve lucide — Xenoria est un système personnel qui ne cherche pas à vous imposer des interprétations toutes faites, mais qui repose sur l’observation à long terme de votre propre univers onirique.</p>\n  <p>L’univers des rêves est unique pour chaque personne. Une même personne, un même lieu, animal, objet ou événement peut avoir une signification totalement différente pour deux personnes — et même chez une seule personne, cette signification peut évoluer avec le temps.</p>\n  <p>C’est pourquoi l’IA de Xenoria ne choisit pas simplement une signification dans un dictionnaire de rêves figé.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">🤖</span>Une IA qui recherche vos propres motifs</h2>\n  <p>L’IA recherche dans vos entrées les personnes, lieux, histoires, émotions, symboles, signes de rêve et autres liens récurrents, puis vous aide à voir comment ces éléments sont reliés et comment ils évoluent au fil du temps.</p>\n  <p>Elle peut tenir compte non seulement de la fréquence d’apparition d’un élément, mais aussi du contexte dans lequel il revient, des émotions qui lui sont associées, des éléments qui apparaissent avec lui et des signes de rêve qui ont déjà conduit à une prise de conscience lucide.</p>\n  <p><strong>✨ Le journal conserve. L’IA organise. L’expérience vous appartient.</strong></p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">🌀</span>Des types d’expériences suivis séparément</h2>\n  <p>Xenoria distingue les rêves, les rêves lucides, les voyages astraux, les voyages de l’âme et les expériences de méditation. Chaque domaine suit les détails réellement pertinents pour ce type d’expérience.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">🔹</span>Fonctions principales</h2>\n  <ul>\n    <li>journal de rêves personnel avec vos propres types de rêves,</li>\n    <li>analyse des rêves assistée par IA et reconnaissance de motifs à long terme,</li>\n    <li>suivi des personnes, lieux, symboles, thèmes et signes de rêve récurrents,</li>\n    <li>statistiques détaillées et carte personnelle des rêves,</li>\n    <li>techniques de rêve lucide et entraînement aux signes de rêve,</li>\n    <li>tests de réalité : mains, texte, horloge, respiration et signes de rêve personnels,</li>\n    <li>pour les rêves lucides : techniques d’induction et de stabilisation, moments de reconnaissance et objectifs,</li>\n    <li>pour les voyages astraux et de l’âme : préparation, techniques de sortie, état vibratoire, séparation partielle ou complète, rencontres, questions et prises de conscience,</li>\n    <li>pour la méditation : méthodes, sensations corporelles et intérieures, phénomènes énergétiques, états de conscience et perception du temps,</li>\n    <li>minuteur de méditation avec temps de préparation, signaux intermédiaires, son de début et de fin,</li>\n    <li>musiques de méditation Xenoria et vos propres musiques,</li>\n    <li>alarme spéciale pour favoriser un rappel calme des rêves après le réveil,</li>\n    <li>contenus sur la recherche sur les rêves, le rêve lucide, la méditation et la recherche sur la conscience.</li>\n  </ul>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">⏰</span>Une alarme spéciale pour se souvenir de ses rêves</h2>\n  <p>L’alarme spéciale de Xenoria ne fonctionne pas comme un réveil classique. Le bref signal ne retentit que le nombre de fois que vous avez défini, puis s’arrête automatiquement.</p>\n  <p>Il n’y a pas de fonction snooze et vous n’avez pas besoin de saisir immédiatement votre téléphone. Vous pouvez ainsi rester calme après le réveil et essayer de vous rappeler la dernière scène de votre rêve.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">🌌</span>Rêve lucide basé sur vos propres signes de rêve</h2>\n  <p>La partie consacrée au rêve lucide ne se limite pas à des techniques générales. À mesure que votre collection de rêves grandit, vous pouvez mieux reconnaître les personnes, lieux, événements et signes de rêve qui vous sont propres.</p>\n  <p>Vous pouvez ensuite relier ces motifs aux tests de réalité et à l’intention posée avant l’endormissement.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">📊</span>Des statistiques qui rendent visibles les changements à long terme</h2>\n  <p>L’objectif des statistiques n’est pas simplement de compter. Xenoria met en évidence les motifs récurrents, les résultats de votre pratique et les changements au fil du temps.</p>\n  <p>Vous pouvez ainsi voir non seulement ce qui s’est passé hier, mais aussi d’où vous êtes parti, où vous en êtes aujourd’hui et ce qui vous a aidé à progresser.</p>\n</div>\n\n<div class=\"info-section\">\n  <h2 class=\"section-title\"><span class=\"section-icon\">📖</span>Un journal de rêves qui ressemble à un véritable livre personnel</h2>\n  <p>Le journal lui-même fait partie de l’expérience. Ce n’est pas une simple liste de notes, mais un journal de rêves magique, présenté comme un livre dont les pages peuvent être tournées comme si vous teniez réellement votre propre livre de rêves entre les mains.</p>\n  <p>Le design et les cadres personnalisables renforcent l’impression que vous ne stockez pas simplement des entrées, mais que vous construisez un livre de rêves personnel qui continue de grandir.</p>\n</div>\n\n<div class=\"notice\">\n  <h3>✨ Votre expérience reste la vôtre</h3>\n  <p>Xenoria ne cherche pas à décider à votre place ce qu’un rêve, une rencontre ou un état de conscience particulier signifiait.</p>\n  <p>L’application vous donne des outils pour conserver, organiser, comparer et suivre vos propres expériences sur une longue période.</p>\n</div>\n", "footerText": "Développement d’applications Android", "comingSoon": "Bientôt"}};
